image:
  registry: europe-west1-docker.pkg.dev/gd-gcp-gridu-devops-t1-t2/ar-registry
  pullPolicy: Always

# Redis is installed separately (helm install ar-redis bitnami/redis).
# The password lives only in this Kubernetes Secret, created by hand.
redis:
  enabled: true
  host: ar-redis-master
  port: 6379
  secretName: ar-redis-secret
  secretKey: redis-password

services:
  productcatalogservice:
    image: ar-productcatalogservice
    tag: v3
    port: 3550
    probe: grpc
    runAsUser: 65532
    env:
      PORT: "3550"
      DISABLE_PROFILER: "1"
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
    hpa: {min: 1, max: 3, cpu: 50}

  cartservice:
    image: ar-cartservice
    tag: v1
    port: 7070
    probe: grpc
    runAsUser: 10001
    useRedis: true
    env: {}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 300m, memory: 256Mi}

  shippingservice:
    image: ar-shippingservice
    tag: v1
    port: 50051
    probe: grpc
    runAsUser: 65532
    env:
      PORT: "50051"
      DISABLE_TRACING: "1"
      DISABLE_PROFILER: "1"
      DISABLE_STATS: "1"
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}

  currencyservice:
    image: ar-currencyservice
    tag: v1
    port: 7000
    probe: grpc
    runAsUser: 10001
    env:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}

  frontend:
    image: ar-frontend
    tag: v3
    port: 8080
    servicePort: 80
    probe: http
    ingress: true
    runAsUser: 65532
    env:
      PORT: "8080"
      ENABLE_PROFILER: "0"
      PRODUCT_CATALOG_SERVICE_ADDR: "ar-productcatalogservice:3550"
      CART_SERVICE_ADDR: "ar-cartservice:7070"
      # not deployed in this reduced setup (gRPC clients are lazy)
      CURRENCY_SERVICE_ADDR: "ar-currencyservice:7000"
      RECOMMENDATION_SERVICE_ADDR: "ar-recommendationservice:8080"
      CHECKOUT_SERVICE_ADDR: "ar-checkoutservice:5050"
      SHIPPING_SERVICE_ADDR: "ar-shippingservice:50051"
      AD_SERVICE_ADDR: "ar-adservice:9555"
      SHOPPING_ASSISTANT_SERVICE_ADDR: "ar-shoppingassistantservice:80"
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
    hpa: {min: 1, max: 4, cpu: 50}
