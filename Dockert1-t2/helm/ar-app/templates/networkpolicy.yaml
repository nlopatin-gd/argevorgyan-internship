# Only pods in this namespace may talk to each other (this includes Redis); other namespaces are denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ar-deny-other-namespaces
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Allow the Google Cloud load balancer / health checks to reach the frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ar-allow-gclb-to-frontend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: ar-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: {{ .Values.services.frontend.port }}
