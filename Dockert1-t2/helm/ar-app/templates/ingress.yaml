{{- range $name, $svc := .Values.services }}
{{- if $svc.ingress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ar-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  defaultBackend:
    service:
      name: ar-{{ $name }}
      port:
        number: {{ $svc.servicePort | default $svc.port }}
{{- end }}
{{- end }}
