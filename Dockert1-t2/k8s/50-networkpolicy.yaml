# Only pods in the same namespace may talk to each other; other namespaces are denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ar-deny-other-namespaces
  namespace: ar-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Allow the Google Cloud load balancer / health checks to reach the frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ar-allow-gclb-to-frontend
  namespace: ar-app
spec:
  podSelector:
    matchLabels:
      app: ar-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: 8080
