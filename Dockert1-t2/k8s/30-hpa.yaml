apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ar-frontend
  namespace: ar-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ar-frontend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ar-productcatalogservice
  namespace: ar-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ar-productcatalogservice
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
