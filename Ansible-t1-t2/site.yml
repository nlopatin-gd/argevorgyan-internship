---
- name: Common baseline
  hosts: all
  vars_files:
    - vars.yml
    - group_vars/all/vault.yml
  roles:
    - common

- name: Web servers
  hosts: webservers
  vars_files:
    - vars.yml
    - group_vars/all/vault.yml
  roles:
    - nginx

- name: Load balancer
  hosts: loadbalancer
  vars_files:
    - vars.yml
    - group_vars/all/vault.yml
  roles:
    - haproxy
