---
env: production
app_name: boutique
app_port: 80

nginx_worker_processes: auto
nginx_worker_connections: 4096
nginx_keepalive_timeout: 75
nginx_server_name: "boutique.example.com"
nginx_root: /var/www/html

haproxy_stats_port: 8404
haproxy_stats_uri: /stats
haproxy_balance: leastconn
haproxy_maxconn: 20000
haproxy_timeout_connect: "5s"
haproxy_timeout_client:  "60s"
haproxy_timeout_server:  "60s"

allowed_ports:
  - "22/tcp"
  - "80/tcp"
  - "443/tcp"
