apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argevorgyan-db-secret
  namespace: argevorgyan-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: argevorgyan-secret-store
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: argevorgyan-db-password
