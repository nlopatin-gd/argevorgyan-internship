apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: argevorgyan-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: europe-west1-docker.pkg.dev/gd-gcp-gridu-devops-t1-t2/argevorgyan-registry/backend:v1
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "YOUR_CLOUD_SQL_PUBLIC_IP"
            - name: DB_NAME
              value: "argevorgyan_appdb"
            - name: DB_USER
              value: "argevorgyan-db-user"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: BUCKET_NAME
              value: "argevorgyan-bucket"
            - name: PUBSUB_TOPIC
              value: "argevorgyan-topic"
            - name: GCP_PROJECT
              value: "gd-gcp-gridu-devops-t1-t2"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/key.json"
          volumeMounts:
            - name: gcp-sa-key
              mountPath: /var/secrets/google
              readOnly: true
      volumes:
        - name: gcp-sa-key
          secret:
            secretName: gcp-sa-key
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: argevorgyan-app
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
