apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argevorgyan-ingress
  namespace: argevorgyan-app
spec:
  ingressClassName: "nginx"
  rules:
    - http:
        paths:
          - path: /upload
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argevorgyan-ingress-processor
  namespace: argevorgyan-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: "nginx"
  rules:
    - http:
        paths:
          - path: /processor(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: image-processor
                port:
                  number: 80
